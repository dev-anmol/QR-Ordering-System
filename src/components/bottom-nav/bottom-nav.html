<div class="md:hidden fixed bottom-0 left-0 right-0 z-50 px-6 pb-6 pt-2 pointer-events-none bg-transparent">
  <div class="max-w-md mx-auto pointer-events-auto bg-transparent">
    <nav class="glass-dark rounded-[2.5rem] p-1.5 flex items-center justify-between border border-white/20 backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)]">

      <!-- Menu Link -->
      <a routerLink="/menu" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2.5 transition-all duration-300 text-white/40 hover:text-white/70 active:scale-90">
        <i class="material-icons mb-1 text-[24px]">restaurant_menu</i>
        <span class="text-[10px] font-bold uppercase tracking-wider">Menu</span>
      </a>

      <!-- Cart Link (Centered Highlighting) -->
      <a routerLink="/cart" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2.5 transition-all duration-300 text-white/40 hover:text-white/70 active:scale-90 relative">
        <div class="relative">
          <i class="material-icons mb-1 text-[24px]">shopping_basket</i>
          @if ((cartItemCount$ | async); as count) {
          @if (count > 0) {
          <span
            class="absolute -top-1 -right-2 bg-yellow-400 text-black text-[10px] font-black w-4.5 h-4.5 flex items-center justify-center rounded-full border-2 border-[#090A0F] shadow-lg animate-pulse">
            {{ count }}
          </span>
          }
          }
        </div>
        <span class="text-[10px] font-bold uppercase tracking-wider">Cart</span>
      </a>

      <!-- Orders Link -->
      <a routerLink="/orders" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2.5 transition-all duration-300 text-white/40 hover:text-white/70 active:scale-90">
        <i class="material-icons mb-1 text-[24px]">receipt_long</i>
        <span class="text-[10px] font-bold uppercase tracking-wider">Orders</span>
      </a>

    </nav>
  </div>
</div>
