<!-- Premium Mobile Bottom Navigation -->
<div class="md:hidden fixed bottom-0 left-0 right-0 z-50 px-4 pb-8 pt-2 pointer-events-none">
  <div class="max-w-md mx-auto pointer-events-auto shadow-2xl">
    <nav class="glass-dark rounded-[2.5rem] p-2 flex items-center justify-between border border-white/10">

      <!-- Menu Link -->
      <a routerLink="/menu" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2 transition-all duration-300 text-white/50">
        <i class="material-icons mb-1 text-[22px]">restaurant_menu</i>
        <span class="text-[9px] font-bold uppercase tracking-widest">Menu</span>
      </a>

      <!-- Cart Link (Centered Highlighting) -->
      <a routerLink="/cart" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2 transition-all duration-300 text-white/50 relative">
        <div class="relative">
          <i class="material-icons mb-1 text-[22px]">shopping_basket</i>
          @if ((cartItemCount$ | async); as count) {
          @if (count > 0) {
          <span
            class="absolute -top-1 -right-1.5 bg-yellow-400 text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full border-2 border-black/80">
            {{ count }}
          </span>
          }
          }
        </div>
        <span class="text-[9px] font-bold uppercase tracking-widest">Cart</span>
      </a>

      <!-- Orders Link -->
      <a routerLink="/orders" routerLinkActive="nav-active"
        class="flex-1 flex flex-col items-center py-2 transition-all duration-300 text-white/50">
        <i class="material-icons mb-1 text-[22px]">receipt_long</i>
        <span class="text-[9px] font-bold uppercase tracking-widest">Orders</span>
      </a>

    </nav>
  </div>
</div>

<style>
  /* Extra style for active items for better contrast on the dark glass */
  .nav-active {
    color: #facc15 !important;
    /* Yellow-400 equivalent */
  }

  .nav-active i {
    transform: translateY(-2px);
  }
</style>
