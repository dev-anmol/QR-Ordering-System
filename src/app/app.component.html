<router-outlet></router-outlet>

<!-- Premium DineSphere Alert Modal (Global) -->
<div *ngIf="alertService.alertState() as alert" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Modal Backdrop -->
  <div class="absolute inset-0 bg-[#090A0F]/65 backdrop-blur-sm transition-opacity duration-300 animate-in fade-in duration-200" (click)="alertService.close()"></div>
  
  <!-- Modal Panel -->
  <div class="relative bg-white/95 backdrop-blur-xl w-full max-w-sm rounded-[2.5rem] p-8 border border-white/40 shadow-[0_25px_60px_-15px_rgba(9,10,15,0.25)] text-center animate-in zoom-in-95 duration-200 z-10">
    <!-- Brand Logo Icon / Header -->
    <div class="flex flex-col items-center mb-5">
      <div class="w-16 h-16 rounded-3xl flex items-center justify-center mb-4 transition-all shadow-lg border"
           [ngClass]="{
             'bg-emerald-500/10 text-emerald-500 border-emerald-500/20 shadow-emerald-500/5': alert.type === 'success',
             'bg-amber-500/10 text-amber-600 border-amber-500/20 shadow-amber-500/5': alert.type === 'warning',
             'bg-red-500/10 text-red-500 border-red-500/20 shadow-red-500/5': alert.type === 'error',
             'bg-indigo-500/10 text-indigo-600 border-indigo-500/20 shadow-indigo-500/5': alert.type === 'info'
           }">
        <svg *ngIf="alert.type === 'success'" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        <svg *ngIf="alert.type === 'warning'" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
        <svg *ngIf="alert.type === 'error'" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <svg *ngIf="alert.type === 'info'" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
        </svg>
      </div>
      <span class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400">DineSphere Assist</span>
    </div>

    <!-- Alert Title & Message -->
    <h3 class="text-xl font-black text-[#090A0F] mb-2 leading-tight tracking-wide">{{ alert.title }}</h3>
    <p class="text-xs text-gray-500 font-medium mb-8 leading-relaxed px-4">{{ alert.message }}</p>
    
    <!-- Action Button -->
    <button (click)="alertService.close()" 
            class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#090A0F] to-[#2B1E5A] hover:from-[#1b1c24] hover:to-[#382b6e] text-white font-bold text-xs uppercase tracking-widest shadow-lg shadow-[#090A0F]/10 hover:shadow-[#090A0F]/20 transition-all active:scale-[0.98] cursor-pointer">
      Dismiss
    </button>
  </div>
</div>
