<section style="backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);"
  class="flex items-center justify-center flex-col w-full text-center bg-[#090A0F]/90 border-b border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
  <!-- Top Announcement Bar -->
  <div class="w-full bg-transparent text-gray-400 py-2 px-4 border-b border-white/5 hidden md:block">
    <div
      class="max-w-7xl mx-auto flex justify-center items-center gap-4 text-[11px] font-bold uppercase tracking-[0.2em]">
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-pulse"></span>
        Live Menu
      </span>
      <span class="opacity-30">|</span>
      <span class="text-white/70">Quick Ordering Enabled</span>
      <span class="opacity-30">|</span>
      <span class="text-yellow-400">Scan. Order. Enjoy.</span>
    </div>
  </div>

  <div class="w-full max-w-7xl px-4 md:px-8 py-3">
    <div class="flex flex-row justify-between items-center">
      <!-- Logo with True Transparency -->
      <div class="flex items-center cursor-pointer group" routerLink="/">
        <img src="assets/images/dinesphere_hd_transparent.png" alt="DineSphere Logo"
          class="h-14 md:h-16 w-auto object-contain transition-transform duration-300 group-hover:scale-105" />
      </div>

      <!-- Mobile Controls -->
      <div class="flex items-center gap-3 md:hidden">
        @if (!isOrdersPage()) {
        <button routerLink="/orders" class="bg-white/10 text-white p-2 rounded-xl active:scale-95 transition-all">
          <i class="material-icons text-xl">receipt_long</i>
        </button>
        }

        @if (!isCartPage()) {
        <button routerLink="/cart"
          class="relative bg-white/10 backdrop-blur-md text-white border border-white/20 p-2 rounded-xl active:scale-95 transition-all shadow-sm">
          <i class="material-icons text-xl">shopping_cart</i>
          @if (cartCount$ | async) {
          <span
            class="absolute -top-1.5 -right-1.5 bg-yellow-400 text-black text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center border-2 border-[#090A0F]">
            {{ cartCount$ | async }}
          </span>
          }
        </button>
        }
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex gap-8 items-center">
        <div class="flex gap-6 text-sm font-semibold text-gray-400">
          <a routerLink="/menu" class="hover:text-white transition-colors cursor-pointer capitalize">Menu</a>
          <a routerLink="/orders" class="hover:text-white transition-colors cursor-pointer capitalize">Orders</a>
        </div>

        <div class="h-6 w-[1px] bg-white/20 mx-2"></div>

        <div class="flex items-center gap-4">
          @if (getLastOrderId()) {
          <button [routerLink]="['/order', getLastOrderId()]"
            class="text-xs font-bold uppercase tracking-wider text-yellow-400 hover:text-yellow-300 transition-colors flex items-center gap-2">
            <span class="material-icons text-sm">shopping_cart</span>
            My Order
          </button>
          }

          @if (!isCartPage() && (ui.showCart() || (cartCount$ | async))) {
          <button routerLink="cart"
            class="relative flex items-center gap-2 bg-white/10 backdrop-blur-md text-white border border-white/20 px-5 py-2.5 rounded-2xl font-bold text-sm hover:bg-white/20 transition-all active:scale-95 shadow-sm">
            <i class="material-icons text-lg">shopping_cart</i>
            <span>Cart</span>
            @if (cartCount$ | async) {
            <span
              class="bg-yellow-400 text-black text-[10px] font-black rounded-full h-5 px-1.5 flex items-center justify-center border border-[#090A0F]">
              {{ cartCount$ | async }}
            </span>
            }
          </button>
          }
        </div>
      </nav>
    </div>
  </div>
</section>
